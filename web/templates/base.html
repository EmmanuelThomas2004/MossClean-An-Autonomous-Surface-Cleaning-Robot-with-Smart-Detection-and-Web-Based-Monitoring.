<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOSS OS</title>

    <style>
        :root {
            --bg: #0d0d0d;
            --glass: rgba(255, 255, 255, 0.08);
            --green: #00ff9d;
            --red: #ff4d4d;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 0;
        }

        .layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: #111;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
        }

        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: radial-gradient(circle at center, #1a1a1a, #000);
        }

        .glass {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .nav {
            padding: 15px;
            color: #888;
            text-decoration: none;
            display: block;
            margin-bottom: 5px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .nav:hover,
        .nav.active {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        button {
            background: #333;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
    </style>
</head>

<body>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div style="background:var(--red); padding:10px; text-align:center;">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>
</html>
